name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\quick-desktop.iss /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $asset = "dist\quick-desktop-v${{ steps.version.outputs.version }}-windows-x64.exe"
          if (-not (Test-Path $asset)) {
            throw "Installer not found at $asset"
          }
          gh release create "${{ github.ref_name }}" $asset `
            --title "Quick ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag `
            || gh release upload "${{ github.ref_name }}" $asset --clobber
