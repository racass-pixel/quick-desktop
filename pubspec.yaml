name: quick_desktop
description: "Quick — private messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.2

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.20.1

  # Desktop window
  window_manager: ^0.4.3

  # Auto-updater
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5

  # Reserved for the upcoming calls phase (S4/S5). Pinning now so we don't
  # have a second dep-resolution churn when calls land.
  livekit_client: ^2.4.3

  # voice feature
  record: ^6.0.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
